version: 2
before:
  hooks:
    # Tab-completion scripts for the archives and the Homebrew formula.
    - sh -c 'mkdir -p completions && for s in bash zsh fish; do go run . completion $s > completions/qari.$s; done'
builds:
  - env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}}"]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE, completions/*]
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
# The formula and the manifest live in this repository, so it is its own tap and bucket.
brews:
  - repository:
      owner: 3mro777o
      name: qari
      branch: main
    directory: Formula
    homepage: https://github.com/3mro777o/qari
    description: Terminal Quran player for mp3quran.net
    license: MIT
    dependencies: [mpv]
    install: |
      bin.install "qari"
      bash_completion.install "completions/qari.bash" => "qari"
      zsh_completion.install "completions/qari.zsh" => "_qari"
      fish_completion.install "completions/qari.fish"
    commit_msg_template: "Homebrew formula for {{ .Tag }}"
scoops:
  - repository:
      owner: 3mro777o
      name: qari
      branch: main
    directory: bucket
    homepage: https://github.com/3mro777o/qari
    description: Terminal Quran player for mp3quran.net
    license: MIT
    commit_msg_template: "Scoop manifest for {{ .Tag }}"
